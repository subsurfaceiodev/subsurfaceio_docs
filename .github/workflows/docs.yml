name: Documentation

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"

      - name: Configure git auth
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBSURFACEIO_FINE_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Install project + deps
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Deploy
        run: |
          zensical build --clean
